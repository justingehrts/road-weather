# RWIS sites near Columbus, Ohio.
#
# The OHGO site ids, coordinates and counties below are REAL (taken from OHGO's API on 2026-11-09; every
# site had a pavement sensor reporting a temperature at that moment). Site 200053 (I-70 WB at Buena Vista Rd)
# was deliberately left out.
#
# !! STILL GENERIC GUESSES !!  The pavement layers, station types and traffic levels below are not
# known yet. All sites use METRo's own example road (8 in of asphalt over 18 in of crushed rock) and are
# treated as ordinary roads. Replace them with real values (ODOT may have them) before trusting any forecast.
#
# Fields:
#   id             short stable identifier (lowercase, no spaces); here "rwis_" + the OHGO id
#   name           human-readable name
#   lat, lon       decimal degrees (WGS84), as reported by OHGO (about 10 m precision)
#   ohgo_site_id   site ID in the OHGO RWIS API (a number, kept as text)
#   station_type   road | bridge
#   pavement_layers  list ordered top -> bottom; each has material + thickness_m
#                    METRo only knows 4 materials: asphalt, cement (or concrete),
#                    crushed rock (or gravel), sand. For a road, METRo adds 20 m of
#                    sand below your last layer automatically.
#   paired_road_site (optional, bridges) id of a nearby ordinary road site. Used by
#                    the "bridges first" flag (bridge freezes while that road doesn't).
#   traffic        (optional) heavy | normal. Only "heavy" sites get the
#                    "wheel-track glazing" flag. Defaults to normal. Here: Interstate sites are
#                    "heavy" and everything else is left as normal (a guess).

