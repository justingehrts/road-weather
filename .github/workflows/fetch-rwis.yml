name: Fetch RWIS observations

on:
  workflow_dispatch:

permissions:
  contents: write   # needed to push CSVs to the `data` branch

concurrency:
  group: data-branch-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code (main)
        uses: actions/checkout@v4

      - name: Check out data branch (create it if missing)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add databranch origin/data
            git -C databranch checkout -B data origin/data
          else
            git worktree add --orphan -b data databranch
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests==2.32.3 pyyaml==6.0.2

      - name: Fetch observations
        env:
          OHGO_API_KEY: ${{ secrets.OHGO_API_KEY }}
        run: python scripts/fetch_rwis.py --out-dir databranch/data/obs

      - name: Commit CSVs to data branch
        working-directory: databranch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/obs
          if git diff --cached --quiet; then
            echo "No new observations."
          else
            git commit -m "Add RWIS observations $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin data
          fi
