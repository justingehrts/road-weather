name: Fetch RWIS observations and HRRR forcing

on:
  workflow_dispatch:

permissions:
  contents: write   # needed to push CSVs to the `data` branch

concurrency:
  group: data-branch-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # HRRR step may wait up to 60 min for f48
    steps:
      - name: Check out code (main)
        uses: actions/checkout@v4

      - name: Check out data branch (create it if missing)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add databranch origin/data
            git -C databranch checkout -B data origin/data
          else
            git worktree add --orphan -b data databranch
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests==2.32.3 pyyaml==6.0.2 herbie-data==2026.10.0 cfgrib==0.9.15.1 eccodes==2.50.0

      - name: Fetch observations
        env:
          OHGO_API_KEY: ${{ secrets.OHGO_API_KEY }}
        run: python scripts/fetch_rwis.py --out-dir databranch/data/obs

      - name: Fetch HRRR forcing (waits up to 60 min for forecast hour 48)
        run: python scripts/fetch_hrrr.py --out-dir databranch/data/forcing

      # Runs even if the HRRR step failed, so fresh observations are still saved.
      - name: Commit CSVs to data branch
        if: ${{ !cancelled() }}
        working-directory: databranch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/obs data/forcing
          if git diff --cached --quiet; then
            echo "No new observations."
          else
            git commit -m "Add RWIS observations and HRRR forcing $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin data
          fi
